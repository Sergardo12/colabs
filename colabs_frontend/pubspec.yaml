name: colabs_frontend
description: App móvil Colabs — conecta colaboradores con clientes.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  smooth_page_indicator: ^1.2.0+3
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: 14.0.2
  socket_io_client: ^2.0.3
  shared_preferences: ^2.3.2
  rxdart: ^0.27.7
  bloc_concurrency: ^0.2.5
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/icons/app_icon_foreground.png
  android_12:
    color: "#000000"
    image: assets/icons/app_icon_foreground.png